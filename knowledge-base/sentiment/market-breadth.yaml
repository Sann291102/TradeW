    type: measured_by
    weight: 0.8
  - to: market-regime
    type: confirms
    weight: 0.75
  - to: distribution
    type: confirms
    weight: 0.6
  - to: retail-positioning
    type: similar_to
    weight: 0.5
tags: [sentiment, breadth, index]
