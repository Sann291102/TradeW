<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeW — Trading Terminal v0.5 (Core + TradeW AI + Sentinel)</title>
<style>
/* ============ design tokens (v0.3 preserved) + dark variant ============ */
:root{
  --bg:#f5f7fb; --card:#ffffff; --border:#e6eaf2; --border2:#d7deea;
  --text:#1c2536; --muted:#6b7a99; --faint:#95a3bd;
  --teal:#0d9488; --teal-bg:#e6f7f5;
  --green:#089981; --green-bg:#e8f6f3; --red:#e4573d; --red-bg:#fdeeea;
  --amber:#e8930c; --amber-bg:#fdf3e3; --navy:#1a2b4a; --hover:#f8fafd;
  --shadow:0 10px 30px rgba(16,24,40,.14);
}
body[data-theme="dark"]{
  --bg:#0d1524; --card:#131e33; --border:#1e2c47; --border2:#2a3a5c;
  --text:#e2e8f0; --muted:#8ea0c4; --faint:#64769c;
  --teal:#14b8a6; --teal-bg:#12312f;
  --green:#26a69a; --green-bg:#0f2e2a; --red:#ef5350; --red-bg:#3a1f1e;
  --amber:#f0a53c; --amber-bg:#3a2d14; --navy:#e2e8f0; --hover:#182642;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;transition:background .25s}
button{cursor:pointer;font:inherit;border:none;border-radius:8px;background:none;color:inherit}
input,select{font:inherit;background:var(--card);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:7px 10px;width:100%}
input:focus,select:focus{outline:2px solid rgba(13,148,136,.35);border-color:var(--teal)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px}::-webkit-scrollbar-track{background:transparent}
.up{color:var(--green)}.dn{color:var(--red)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px;transition:background .25s}
h2{font-size:16px;margin-bottom:12px}
h2 small{color:var(--faint);font-weight:400;font-size:12px}
.fade{animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ============ top nav ============ */
#nav{display:flex;align-items:center;gap:2px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--border);height:54px;flex-shrink:0}
#brand{display:flex;align-items:baseline;gap:9px;margin-right:12px;cursor:pointer}
#brand .logo{font-size:20px;font-weight:800;color:var(--navy)}
#brand .logo em{color:var(--teal);font-style:normal}
#brand .paper{font-size:9.5px;font-weight:700;color:var(--amber);border:1px solid var(--amber);border-radius:8px;padding:1px 7px;letter-spacing:.5px}
.nbtn{padding:8px 11px;color:var(--muted);font-weight:600;font-size:13px;border-radius:8px}
.nbtn:hover{background:var(--bg)}
.nbtn.on{color:var(--teal);background:var(--teal-bg)}
#navR{margin-left:auto;display:flex;align-items:center;gap:12px}
#navR .f{text-align:right;line-height:1.25}
#navR .f .l{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px}
#navR .f .v{font-weight:700;font-size:13px}
#bellBtn{position:relative;font-size:17px;padding:6px 9px;border-radius:8px}
#bellBtn:hover{background:var(--bg)}
#bellDot{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;font-size:9px;font-weight:800;border-radius:9px;padding:1px 5px;display:none}
#mktPill{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--bg);padding:5px 11px;border-radius:14px;white-space:nowrap}
#mktPill .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:pulse 2s infinite}
#mktPill .dot.live{background:var(--green)}
#mktPill .dot.off{background:var(--faint);animation:none}
@keyframes pulse{50%{opacity:.4}}
.wlActions{display:flex;gap:6px;padding:6px 14px 8px;background:var(--teal-bg);border-bottom:1px solid var(--border)}
.wlActions button{font-size:10.5px;font-weight:700;color:var(--teal);border:1px solid var(--teal);border-radius:8px;padding:3px 10px}
.wlActions button:hover{background:var(--teal);color:#fff}
.expTag{font-size:9px;font-weight:800;color:var(--amber);border:1px solid var(--amber);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
#themeBtn{font-size:15px;padding:6px 9px;border-radius:8px}
#themeBtn:hover{background:var(--bg)}
#resetBtn{font-size:11.5px;color:var(--muted);border:1px solid var(--border2);padding:6px 11px;border-radius:8px}
#resetBtn:hover{color:var(--red);border-color:var(--red)}

/* ============ index strip ============ */
#strip{background:var(--card);border-bottom:1px solid var(--border);padding:7px 0;flex-shrink:0;overflow:hidden}
.stripTrack{display:inline-flex;white-space:nowrap;animation:stripSlide 26s linear infinite}
#strip:hover .stripTrack{animation-play-state:paused}
@keyframes stripSlide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.six{display:flex;gap:8px;align-items:baseline;padding:0 16px;border-right:1px solid var(--border);white-space:nowrap;cursor:pointer}
.six:first-child{padding-left:0}.six:last-child{border-right:none}
.six .n{font-weight:600;font-size:12.5px}
.six .v{font-size:12.5px;font-weight:700}
.six .c{font-size:11.5px}

/* ============ layout ============ */
#main{display:flex;flex:1;min-height:0}
#sidebar{width:296px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column}
#sideHd{padding:12px 14px 6px}
#srchWrap{position:relative}
#srchRes{position:absolute;top:40px;left:0;right:0;background:var(--card);border:1px solid var(--border2);border-radius:10px;box-shadow:var(--shadow);z-index:60;max-height:340px;overflow:auto;display:none}
.srow{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:12.5px;border-bottom:1px solid var(--border)}
.srow:last-child{border:none}
.srow:hover{background:var(--hover)}
.srow .k{font-size:9.5px;font-weight:800;color:var(--faint);border:1px solid var(--border2);border-radius:6px;padding:1px 6px;align-self:center;white-space:nowrap}
#wlTabs{display:flex;gap:4px;padding:8px 14px 6px;flex-wrap:wrap;align-items:center}
.wlt{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--border2);border-radius:12px;padding:3px 10px}
.wlt.on{background:var(--teal);border-color:var(--teal);color:#fff}
#wlAdd{font-size:13px;color:var(--faint);padding:2px 7px}
#wlist{overflow-y:auto;flex:1}
.wrow{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 14px;border-bottom:1px solid var(--border);cursor:pointer;border-left:3px solid transparent}
.wrow:hover{background:var(--hover)}
.wrow.sel{background:var(--teal-bg);border-left-color:var(--teal)}
.wrow.dragover{border-top:2px solid var(--teal)}
.wrow .sym{font-weight:700;font-size:12.5px}
.wrow .nm{color:var(--faint);font-size:10.5px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .px{text-align:right}
.wrow .px .ltp{font-weight:700;font-size:12.5px}
.wrow .px .chg{font-size:10.5px}
.wrow .rm{opacity:0;font-size:11px;color:var(--faint);padding:2px 6px}
.wrow:hover .rm{opacity:1}
.wrow .rm:hover{color:var(--red)}
#content{flex:1;overflow-y:auto;min-width:0}
.page{max-width:1120px;margin:0 auto;padding:18px 22px 40px}

/* ============ home/dashboard ============ */
.ovGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.ovc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer}
.ovc:hover{border-color:var(--teal)}
.ovc .n{font-size:11.5px;color:var(--muted);font-weight:700}
.ovc .v{font-size:16px;font-weight:800;margin:2px 0}
.ovc .c{font-size:11px}
.ovc canvas{width:100%;height:30px;margin-top:4px}
#pfGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#pfGrid .m .l{font-size:11px;color:var(--muted)}
#pfGrid .m .v{font-size:19px;font-weight:800}
#pfSub{display:flex;gap:24px;align-items:center;border-top:1px solid var(--border);margin-top:12px;padding-top:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
#pfSub b{color:var(--text)}
.mvTabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.mvt{border:1px solid var(--border2);border-radius:16px;padding:5px 13px;font-size:12px;color:var(--muted);font-weight:600}
.mvt.on{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.mrow{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}
.mrow:last-child{border:none}
.mrow:hover{background:var(--hover)}
.homeGrid{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}
.heat{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.htile{border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;color:#fff;transition:background .4s}
.htile .s{font-size:11px;font-weight:700;opacity:.95}
.htile .p{font-size:13px;font-weight:800}
.trend{display:flex;gap:8px;flex-wrap:wrap}
.tchip{border:1px solid var(--border2);border-radius:16px;padding:6px 13px;font-size:12px;cursor:pointer;font-weight:600}
.tchip:hover{border-color:var(--teal);color:var(--teal)}

/* ============ markets category page ============ */
.catRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cat{border:1.5px solid var(--border2);border-radius:10px;padding:7px 16px;font-size:12.5px;font-weight:700;color:var(--muted)}
.cat.on{border-color:var(--teal);color:var(--teal);background:var(--teal-bg)}
.secFilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

/* ============ instrument ============ */
#instHead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
#instHead .big{font-size:19px;font-weight:800}
#instHead .px{font-size:19px;font-weight:800}
#instHead .chg{font-size:13px;font-weight:600}
#instHead .exch{font-size:10px;color:var(--faint);border:1px solid var(--border2);padding:2px 8px;border-radius:8px}
.starBtn{font-size:17px;color:var(--faint);padding:4px 8px}
.starBtn.on{color:var(--amber)}
.btnBuy{background:var(--green);color:#fff;font-weight:800;padding:8px 22px;border-radius:8px}
.btnSell{background:var(--red);color:#fff;font-weight:800;padding:8px 22px;border-radius:8px}
#subTabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:10px 0 16px;flex-wrap:wrap}
.stab{padding:9px 15px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2.5px solid transparent;border-radius:0}
.stab.on{color:var(--teal);border-bottom-color:var(--teal)}
#chartWrap2{position:relative;height:420px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
#chart{position:absolute;inset:0;width:100%;height:100%}
#tfRow{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap;align-items:center}
.tf{border:1px solid var(--border2);border-radius:8px;padding:4px 11px;font-size:12px;color:var(--muted);font-weight:600}
.tf.on{background:var(--navy);color:var(--card);border-color:var(--navy)}
body[data-theme="dark"] .tf.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.ind{border:1px dashed var(--border2);border-radius:8px;padding:4px 10px;font-size:11.5px;color:var(--muted);font-weight:600}
.ind.on{border-style:solid;border-color:var(--teal);color:var(--teal);background:var(--teal-bg)}
.drawBtn{border:1px solid var(--border2);border-radius:8px;padding:4px 10px;font-size:11.5px;color:var(--muted);font-weight:600}
.drawBtn.on{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}

/* option chain */
#expRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.exp{border:1.5px solid var(--border2);border-radius:9px;padding:6px 13px;font-size:12.5px;font-weight:700;color:var(--muted)}
.exp.on{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
#pcrStrip{display:flex;gap:20px;font-size:12px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
#pcrStrip b{color:var(--text)}
table.chain{width:100%;border-collapse:collapse;font-size:12px}
.chain th{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;padding:8px 6px;border-bottom:1.5px solid var(--border2);text-align:right;background:var(--card);position:sticky;top:0;z-index:5}
.chain th.c{text-align:center}
.chain td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:right;position:relative}
.chain tr:hover td{background:var(--hover)}
.chain .stk{text-align:center;font-weight:800;background:var(--bg);font-size:12.5px;width:90px}
.chain .itmC{background:var(--amber-bg)}
.chain .itmP{background:var(--teal-bg)}
.oib{position:absolute;bottom:1px;height:3px;border-radius:2px;background:#f0b35c;opacity:.75}
.oib.pe{background:#7e9bd4}
.bs{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.bs button{width:22px;height:22px;border-radius:5px;color:#fff;font-size:11px;font-weight:800;line-height:1}
.bs .b{background:var(--green)}.bs .s{background:var(--red)}
tr.atmRow td{border-top:2px dashed var(--teal)}
#atmTag{display:inline-block;background:var(--teal);color:#fff;border-radius:10px;font-size:11px;font-weight:800;padding:2px 11px}
.greeks{font-size:10.5px;color:var(--faint)}

/* depth */
.depthGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dt{width:100%;border-collapse:collapse;font-size:12.5px}
.dt th{font-size:10px;color:var(--faint);text-transform:uppercase;padding:6px;border-bottom:1.5px solid var(--border2);text-align:right}
.dt td{padding:6px;text-align:right;position:relative;border-bottom:1px solid var(--border)}
.dbar{position:absolute;top:2px;bottom:2px;border-radius:3px;opacity:.14}
.dbar.b{right:0;background:var(--green)}
.dbar.a{left:0;background:var(--red)}
.ohlcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px}
.ohlcGrid .m{background:var(--bg);border-radius:9px;padding:9px 12px}
.ohlcGrid .m .l{font-size:10px;color:var(--faint);text-transform:uppercase}
.ohlcGrid .m .v{font-weight:800;font-size:14px}

/* tables & misc */
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;text-align:right;padding:8px;border-bottom:1.5px solid var(--border2)}
.t td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:right}
.t th:first-child,.t td:first-child{text-align:left}
.t tr:hover td{background:var(--hover)}
.pill{font-size:10px;padding:2.5px 9px;border-radius:10px;font-weight:800}
.pill.b{background:var(--green-bg);color:var(--green)}.pill.s{background:var(--red-bg);color:var(--red)}
.pill.o{background:var(--amber-bg);color:var(--amber)}.pill.x{background:var(--bg);color:var(--muted)}
.xbtn{border:1px solid var(--border2);color:var(--muted);font-size:11px;padding:4px 11px;border-radius:7px}
.xbtn:hover{color:var(--red);border-color:var(--red)}
.empty{color:var(--faint);text-align:center;padding:36px;font-size:13px}
.chip{border:1px solid var(--border2);border-radius:16px;padding:6px 13px;font-size:12px;color:var(--muted);font-weight:600}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.newsRow{padding:10px 2px;border-bottom:1px solid var(--border);font-size:13px}
.newsRow:last-child{border:none}
.newsRow .t2{color:var(--faint);font-size:11px;margin-top:2px}
.ntag{font-size:9.5px;font-weight:800;border-radius:6px;padding:1px 7px;margin-right:7px;vertical-align:1px}
.ntag.co{background:var(--teal-bg);color:var(--teal)}.ntag.mkt{background:var(--amber-bg);color:var(--amber)}
.ntag.eco{background:var(--red-bg);color:var(--red)}.ntag.act{background:var(--green-bg);color:var(--green)}
.scGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.donutWrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend{font-size:12px;color:var(--muted)}
.legend div{display:flex;align-items:center;gap:7px;margin:3px 0}
.legend .swb{width:10px;height:10px;border-radius:3px}

/* notification panel */
#notifPanel{position:fixed;top:60px;right:16px;width:360px;max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--shadow);z-index:120;display:none}
#notifPanel.show{display:block}
#notifPanel .hd{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:800;display:flex;justify-content:space-between;align-items:center}
#profilePanel{position:fixed;top:60px;right:16px;width:260px;background:var(--card);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--shadow);z-index:120;display:none}
#profilePanel.show{display:block}
#profilePanel .hd{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:800}
.nrow{padding:10px 16px;border-bottom:1px solid var(--border);font-size:12.5px}
.nrow .tm{color:var(--faint);font-size:10.5px}

/* ticket modal */
#ovl{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;z-index:100}
#ovl.show{display:flex}
#tk{background:var(--card);border-radius:14px;width:400px;max-width:94vw;padding:18px;box-shadow:var(--shadow)}
#tkHd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
#tkHd .s{font-size:15px;font-weight:800}
#tkSub{font-size:11.5px;color:var(--muted);margin-bottom:12px}
#tkSide{display:flex;border-radius:9px;overflow:hidden;border:1px solid var(--border2);margin-bottom:12px}
#tkSide button{flex:1;padding:9px;font-weight:800;color:var(--muted);background:var(--bg);border-radius:0}
#tkSide .b.on{background:var(--green);color:#fff}
#tkSide .s.on{background:var(--red);color:#fff}
.tkRow{display:flex;gap:10px;margin-bottom:10px}
.tkRow>div{flex:1}
.lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;font-weight:700}
#tkEst{background:var(--bg);border-radius:9px;padding:10px 12px;font-size:12px;color:var(--muted);margin-bottom:12px}
#tkEst div{display:flex;justify-content:space-between;padding:2px 0}
#tkEst .v{color:var(--text);font-weight:700}
#tkGo{width:100%;padding:12px;font-weight:800;font-size:14px;color:#fff;background:var(--green);border-radius:9px}
#tkGo.sell{background:var(--red)}
#tkErr{color:var(--red);font-size:11.5px;text-align:center;margin-top:8px;min-height:16px}

#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:10px;padding:11px 15px;font-size:12.5px;min-width:250px;box-shadow:var(--shadow);animation:tin .25s ease}
.toast.err{border-left-color:var(--red)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:1100px){.ovGrid{grid-template-columns:repeat(3,1fr)}.heat{grid-template-columns:repeat(4,1fr)}}
@media(max-width:960px){#sidebar{display:none}.homeGrid,.depthGrid{grid-template-columns:1fr}.scGrid{grid-template-columns:repeat(2,1fr)}#pfGrid{grid-template-columns:repeat(2,1fr);gap:12px}.ovGrid{grid-template-columns:repeat(2,1fr)}}

/* ============================================================
   v0.5 additions — TradeW AI (Research) + Sentinel (Safety Nets)
   Two separate systems sharing this app shell. See
   docs/product-architecture/ for the full spec these implement.
============================================================ */
:root{
  --grad1:#5b6ee8; --grad2:#22c1dc; --sentinel-bg:#0d1524; --sentinel-card:#131e33;
  --sentinel-border:#1e2c47; --sentinel-text:#e7ecf6; --sentinel-muted:#8ea0c4;
}
.brandGrad{background:linear-gradient(90deg,var(--grad1),var(--grad2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* -- entrance / motion system -- */
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:calc(200px + 100%) 0}}
@keyframes flashUp{0%{background:var(--green-bg)}100%{background:transparent}}
@keyframes flashDn{0%{background:var(--red-bg)}100%{background:transparent}}
@keyframes softPulse{0%,100%{box-shadow:0 0 0 0 rgba(13,148,136,.35)}50%{box-shadow:0 0 0 6px rgba(13,148,136,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes typingDot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.riseIn{animation:riseIn .38s cubic-bezier(.2,.7,.3,1) both}
.riseIn:nth-child(1){animation-delay:.02s}.riseIn:nth-child(2){animation-delay:.07s}
.riseIn:nth-child(3){animation-delay:.12s}.riseIn:nth-child(4){animation-delay:.17s}
.riseIn:nth-child(5){animation-delay:.22s}.riseIn:nth-child(6){animation-delay:.27s}
.popIn{animation:popIn .3s cubic-bezier(.34,1.56,.64,1) both}
.flashUp{animation:flashUp 1s ease}
.flashDn{animation:flashDn 1s ease}
.card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .25s}
.card.lift:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border2)}
.ovc,.htile,.tchip,.mrow{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.ovc:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.htile:hover{transform:scale(1.04)}

/* -- shared workspace intro strip (Core / TradeW AI / Sentinel) -- */
#wsNav{display:flex;gap:8px;padding:10px 22px 0;max-width:1120px;margin:0 auto}
.wsChip{font-size:11px;font-weight:700;color:var(--faint);display:flex;align-items:center;gap:5px}
.wsChip .d{width:6px;height:6px;border-radius:50%;background:var(--border2)}
.wsChip.on{color:var(--teal)}.wsChip.on .d{background:var(--teal)}

/* -- Sentinel workspace -- */
.sentinelShell{background:linear-gradient(180deg,var(--sentinel-bg),var(--bg) 340px)}
body[data-theme="dark"] .sentinelShell{background:var(--sentinel-bg)}
.sentHero{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:14px;
  background:linear-gradient(120deg,rgba(91,110,232,.14),rgba(34,193,220,.10));
  border:1px solid rgba(91,110,232,.28);margin-bottom:16px}
.sentHero .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--grad1),var(--grad2));font-size:19px;flex-shrink:0;animation:softPulse 2.6s infinite}
.sentHero h1{font-size:16px;margin:0}
.sentHero p{font-size:12px;color:var(--muted);margin-top:2px}
.sentHero .obs{margin-left:auto;font-size:9.5px;letter-spacing:.5px;color:var(--faint);text-transform:uppercase;
  border:1px solid var(--border2);border-radius:8px;padding:4px 9px;white-space:nowrap}
.agentRow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.agentCard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-width:0}
.agentCard .ic{font-size:15px;margin-bottom:6px}
.agentCard .nm{font-weight:700;font-size:12.5px}
.agentCard .st{font-size:10.5px;color:var(--teal);display:flex;align-items:center;gap:5px;margin-top:2px}
.agentCard .st .d{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 1.8s infinite}
.trapCard{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;margin-bottom:10px;
  background:var(--amber-bg);border:1px solid var(--amber)}
.trapCard .tag{font-size:10px;font-weight:800;color:#fff;background:var(--amber);border-radius:7px;padding:3px 9px;white-space:nowrap}
.trapCard .body b{font-size:12.5px}
.trapCard .body p{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.trapCard .body .ev{font-size:10.5px;color:var(--faint);margin-top:5px}
.reflGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.reflCard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;min-width:0}
.reflCard .cat{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;
  padding:3px 9px;border-radius:7px;background:var(--teal-bg);color:var(--teal);margin-bottom:8px}
.reflCard p{font-size:12.5px;line-height:1.5;margin-bottom:8px}
.reflCard a{font-size:11.5px;color:var(--teal);font-weight:700;cursor:pointer}
.reflCard a:hover{text-decoration:underline}
.sent3{display:grid;grid-template-columns:1.1fr 1.1fr .8fr;gap:12px}
.sent3>.card{min-width:0}
.timelineRow{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.timelineRow:last-child{border:none}
.timelineRow .d{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}
.timelineRow .d.info{background:var(--teal)}.timelineRow .d.warn{background:var(--amber)}.timelineRow .d.risk{background:var(--red)}
.timelineRow .tm{font-size:10px;color:var(--faint);margin-top:2px}
.sessStat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.sessStat:last-child{border:none}
.sessStat .v{font-weight:800}
.moodPill{font-size:9.5px;font-weight:800;padding:2.5px 9px;border-radius:9px;text-transform:uppercase;letter-spacing:.3px}
.moodPill.Focused{background:var(--green-bg);color:var(--green)}
.moodPill.Confident{background:var(--teal-bg);color:var(--teal)}
.moodPill.Anxious{background:var(--amber-bg);color:var(--amber)}
.moodPill.Frustrated{background:var(--red-bg);color:var(--red)}
.moodPill.Neutral{background:var(--bg);color:var(--muted)}

/* -- Research workspace -- */
.researchSearch{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border2);
  border-radius:12px;padding:11px 16px;margin-bottom:16px}
.researchSearch input{border:none;background:none;font-size:14px;padding:0}
.researchSearch input:focus{outline:none}
.rHead{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:16px;margin-bottom:14px;flex-wrap:wrap}
.rHead .av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--amber),#f4c064);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:17px;flex-shrink:0}
.rHead .nm{font-size:16px;font-weight:800}
.rHead .tag{font-size:10.5px;color:var(--muted);border:1px solid var(--border2);border-radius:8px;padding:1px 8px;margin-left:8px}
.rHead .desc{font-size:12px;color:var(--muted);margin-top:4px;max-width:520px}
.rHead .explain{font-size:11.5px;color:var(--teal);font-weight:700;cursor:pointer;margin-top:6px;display:inline-block}
.rStats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.rStat{background:var(--bg);border-radius:10px;padding:9px 16px;text-align:center;min-width:100px}
.rStat .l{font-size:10px;color:var(--faint);text-transform:uppercase}
.rStat .v{font-size:15px;font-weight:800;margin-top:2px}
#rTabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap}
.rtab{padding:9px 14px;font-weight:600;font-size:12.5px;color:var(--muted);border-bottom:2.5px solid transparent}
.rtab.on{color:var(--teal);border-bottom-color:var(--teal)}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.r3>div{min-width:0}
.rangeBar{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--red),var(--border2) 50%,var(--green));margin:14px 0 4px}
.rangeBar .dot{position:absolute;top:-5px;width:16px;height:16px;border-radius:50%;background:var(--navy);border:3px solid var(--card);transform:translateX(-50%)}

/* -- TradeW AI ambient dock -- */
#aiFab{position:fixed;right:22px;bottom:22px;width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--grad1),var(--grad2));display:flex;align-items:center;justify-content:center;
  font-size:21px;box-shadow:0 8px 24px rgba(91,110,232,.45);z-index:150;color:#fff;animation:softPulse 3s infinite}
#aiFab:hover{transform:scale(1.06)}
#aiDock{position:fixed;right:22px;bottom:86px;width:388px;max-height:min(620px,78vh);background:var(--card);
  border:1px solid var(--border2);border-radius:16px;box-shadow:var(--shadow);z-index:150;display:none;
  flex-direction:column;overflow:hidden}
#aiDock.show{display:flex;animation:riseIn .28s cubic-bezier(.2,.7,.3,1) both}
#aiDock .hd{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--border)}
#aiDock .hd .ic{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--grad1),var(--grad2));
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
#aiDock .hd .t{font-weight:800;font-size:13px}
#aiDock .hd .s{font-size:10.5px;color:var(--green);display:flex;align-items:center;gap:4px}
#aiDock .hd .s .d{width:6px;height:6px;border-radius:50%;background:var(--green)}
#aiDock .hd .x{margin-left:auto;color:var(--faint);font-size:15px;padding:4px 6px}
#aiMsgs{flex:1;overflow-y:auto;padding:13px 15px;display:flex;flex-direction:column;gap:10px}
.aiMsg{display:flex;gap:8px;max-width:92%}
.aiMsg.me{align-self:flex-end;flex-direction:row-reverse}
.aiMsg .av{width:24px;height:24px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px}
.aiMsg.ai .av{background:linear-gradient(135deg,var(--grad1),var(--grad2));color:#fff}
.aiMsg.me .av{background:var(--navy);color:var(--card)}
.aiMsg .bub{background:var(--bg);border-radius:11px;padding:9px 12px;font-size:12.5px;line-height:1.5}
.aiMsg.me .bub{background:var(--teal);color:#fff}
.aiTyping{display:flex;gap:4px;padding:4px 2px}
.aiTyping span{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:typingDot 1.2s infinite}
.aiTyping span:nth-child(2){animation-delay:.15s}.aiTyping span:nth-child(3){animation-delay:.3s}
.aiChips{display:flex;gap:6px;flex-wrap:wrap;padding:0 15px 10px}
.aiChip{font-size:11px;font-weight:600;color:var(--teal);border:1px solid var(--teal);border-radius:14px;padding:5px 11px}
.aiChip:hover{background:var(--teal);color:#fff}
#aiDock .ft{padding:10px 13px;border-top:1px solid var(--border);display:flex;gap:8px}
#aiDock .ft input{flex:1}
#aiDock .ft button{background:var(--teal);color:#fff;font-weight:800;padding:0 14px;border-radius:9px}
#aiDock .disc{font-size:9.5px;color:var(--faint);text-align:center;padding:0 13px 10px}
@media(max-width:960px){.agentRow,.r3,.reflGrid{grid-template-columns:1fr 1fr}.sent3{grid-template-columns:1fr}#aiDock{width:92vw;right:4vw}}

/* ============================================================
   v0.6 additions — Home rebuilt against real Dhan reference
   screenshots (Portfolio tabs, Invest/Trade grid, Trending tabs,
   avatar-style movers, inline click-to-expand quick view with
   chart + PCR). Markets/Chart pages intentionally untouched.
============================================================ */

.eyeBtn:hover{color:var(--text)}
.topUpRow{display:flex;gap:8px;align-items:center;margin-left:auto}
.topUpRow input{width:120px;padding:6px 9px;font-size:12px}
.topUpRow button{background:var(--teal);color:#fff;font-weight:800;font-size:12px;padding:7px 14px;border-radius:8px;white-space:nowrap}
.investGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.investTile{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 8px;text-align:center;min-width:0}
.investTile .ic{font-size:19px}

.trendTabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.ttab{border:1px solid var(--border2);border-radius:14px;padding:4px 11px;font-size:11px;font-weight:600;color:var(--muted)}
.ttab.on{background:var(--navy);color:var(--card);border-color:var(--navy)}
body[data-theme="dark"] .ttab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.avaRow{display:flex;align-items:center;gap:10px}
.ava{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#fff;flex-shrink:0}
.hoverBS{display:flex;gap:3px;opacity:0;transition:opacity .15s;flex-shrink:0}
.wrow:hover .hoverBS,.mrow:hover .hoverBS{opacity:1}
.hbs{width:21px;height:21px;border-radius:5px;color:#fff;font-size:10px;font-weight:800}
.hbs.b{background:var(--green)}.hbs.s{background:var(--red)}
.qv{border:1.5px solid var(--teal)}
.qvHd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qvStatus{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:2px 8px;border-radius:7px}
.qvStatus.live{background:var(--green-bg);color:var(--green)}
.qvStatus.pre{background:var(--amber-bg);color:var(--amber)}
.qvStatus.closed{background:var(--bg);color:var(--faint)}
#qvTabs{display:flex;gap:2px;border-bottom:1px solid var(--border);flex-wrap:wrap;margin-top:8px}
.qvHd .nm{font-weight:800;font-size:14px}
.qvPcr{display:flex;gap:20px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap}
.qvPcr>div{display:flex;flex-direction:column;gap:2px}
.qvPcr .l{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.3px}
.qvPcr .v{font-size:13.5px;font-weight:800}
.qvActions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.qvActions .bs2{width:34px;height:30px;border-radius:8px;color:#fff;font-weight:800}
.qvActions .bs2.b{background:var(--green)}.qvActions .bs2.s{background:var(--red)}

  constructor(sym,name,base,vol,type,extra){
    this.sym=sym;this.name=name;this.vol=vol;this.type=type;
    this.sector=extra&&extra.sector||null;this.idx=extra&&extra.cfg||undefined;this.fno=!!(extra&&extra.fno)||!!this.idx;

    this.dayHi=Math.max(this.dayOpen,this.ltp)*(1+h*.008);this.dayLo=Math.min(this.dayOpen,this.ltp)*(1-h*.008);
    this.dayVol=Math.floor(2e5+h*3e7);

  }
  ensureBars(){if(this.bars)return;this.bars=[];
    let p=this.dayOpen*(1-.002*randn()),t=Date.now()-SEED_BARS*60000;
    for(let i=0;i<SEED_BARS;i++){const o=p;let h=o,l=o,c=o;

    this.bars.forEach(b=>{b.o=r05(b.o*drift);b.h=r05(b.h*drift);b.l=r05(b.l*drift);b.c=r05(b.c*drift);});}
  tick(){this.prev=this.ltp;
    this.ltp=r05(Math.max(.5,this.ltp*(1+(rnd()-.5)*.00002+this.vol*randn())));
    this.dayHi=Math.max(this.dayHi,this.ltp);this.dayLo=Math.min(this.dayLo,this.ltp);
    this.dayVol+=Math.floor(rnd()*900+80);
    if(!this.bars)return;
    const now=Date.now(),last=this.bars[this.bars.length-1],dv=Math.floor(rnd()*900+80);
    if(now-last.t>=60000){this.bars.push({t:now,o:this.ltp,h:this.ltp,l:this.ltp,c:this.ltp,v:dv});
      if(this.bars.length>1600)this.bars.splice(0,200);}
    else{last.c=this.ltp;last.h=Math.max(last.h,this.ltp);last.l=Math.min(last.l,this.ltp);last.v+=dv;}}
  get chg(){return this.ltp-this.dayOpen}

}

  const wd=cfg.expDay||2,set=new Map(),now=new Date();
  for(let i=0;i<4;i++){const lt=lastWeekday(now.getFullYear(),now.getMonth()+i,wd);
    if(lt>now)set.set(lt.toDateString(),{d:lt,monthly:true});if(set.size>=3)break;}
  if(cfg.weekly)for(const t of nextWeekdays(5,wd)){const k=t.toDateString();
    if(!set.has(k))set.set(k,{d:t,monthly:false});}
  const arr=[...set.values()].sort((a,b)=>a.d-b.d).slice(0,cfg.weekly?6:3);
  return arr.map(e=>({...e,label:e.d.getDate()+" "+e.d.toLocaleString("en",{month:"short"})+(e.monthly?" (M)":""),
    ms:new Date(e.d.getFullYear(),e.d.getMonth(),e.d.getDate(),15,30).getTime()}));}
function bs(S,K,Tms,iv,isCall){const T=Math.max(Tms,0)/YEAR;
  if(T<=1e-9)return{px:Math.max(isCall?S-K:K-S,0),delta:isCall?(S>K?1:0):(S<K?-1:0),gamma:0,theta:0,vega:0};
  const sq=iv*Math.sqrt(T),d1=(Math.log(S/K)+(RFR+iv*iv/2)*T)/sq,d2=d1-sq,ert=Math.exp(-RFR*T);
  const px=isCall?S*normCdf(d1)-K*ert*normCdf(d2):K*ert*normCdf(-d2)-S*normCdf(-d1);
  return{px:Math.max(px,.05),delta:isCall?normCdf(d1):normCdf(d1)-1,
    gamma:pdf(d1)/(S*sq),theta:-(S*pdf(d1)*iv/(2*Math.sqrt(T))+(isCall?1:-1)*RFR*K*ert*normCdf(isCall?d2:-d2))/365,
    vega:S*pdf(d1)*Math.sqrt(T)/100};}
function fnoCfg(sym){const i=insts[sym];if(i.idx)return i.idx;
  const p=i.ltp,step=p<250?2.5:p<500?5:p<1000?10:p<2500?20:p<5000?50:p<20000?100:500;
  let lot=Math.round(1750000/p);lot=lot>=500?Math.round(lot/25)*25:lot>=100?Math.round(lot/5)*5:Math.max(1,lot);
  return{step,lot,ivBase:.24+hash(sym+"iv")*.16,weekly:false,expDay:2};}
function ivFor(sym,K,expMs){const i=insts[sym],cfg=fnoCfg(sym),S=i.ltp;
  const m=Math.log(K/S),skew=m<0?-1.9*m:1.1*m;
  const tFac=1+Math.max(0,(7*864e5-(expMs-Date.now()))/(7*864e5))*.12;
  const j=((K*2654435761)>>>16)%97/970;
  return cfg.ivBase*(1+skew*1.4)*tFac*(1+j*.15);}
function optPx(sym,K,expMs,isCall){return bs(insts[sym].ltp,K,expMs-Date.now(),ivFor(sym,K,expMs),isCall);}
function futPx(sym,expMs){const T=Math.max(expMs-Date.now(),0)/YEAR;return insts[sym].ltp*Math.exp(RFR*T*.9);}
function oiFor(sym,K,expMs,isCall){const step=fnoCfg(sym).step;
  const h=Math.abs((K/step*7919+Math.floor(expMs/864e5)*104729+(isCall?13:29))%1000)/1000;
  const round=K%(step*10)===0?1.9:K%(step*5)===0?1.4:1;
  const S=insts[sym].ltp,dist=Math.exp(-Math.pow((K-S)/(6*step),2));
  return Math.floor((8e5+h*4.5e6)*round*(0.35+dist));}
function chainData(sym,expMs,width){const cfg=fnoCfg(sym),S=insts[sym].ltp,step=cfg.step;
  const atm=Math.round(S/step)*step,strikes=[];
  for(let k=atm-width*step;k<=atm+width*step;k+=step)strikes.push(r05(k));
  let ceT=0,peT=0;
  const rows=strikes.map(K=>{const ce=optPx(sym,K,expMs,true),pe=optPx(sym,K,expMs,false);
    const ceOi=oiFor(sym,K,expMs,true),peOi=oiFor(sym,K,expMs,false);ceT+=ceOi;peT+=peOi;
    return{K,ce,pe,ceOi,peOi,iv:ivFor(sym,K,expMs)*100,
      ceV:Math.floor(ceOi*(0.2+hash(sym+K+"cv")*.5)),peV:Math.floor(peOi*(0.2+hash(sym+K+"pv")*.5))};});
  let mp=strikes[0],best=Infinity;
  for(const Ks of strikes){let pay=0;
    for(const r of rows){pay+=r.ceOi*Math.max(Ks-r.K,0)+r.peOi*Math.max(r.K-Ks,0);}
    if(pay<best){best=pay;mp=Ks;}}
  return{rows,atm,pcr:peT/ceT,maxPain:mp,S,cfg};}

const cid=c=>c.kind==="EQ"?c.sym:`${c.sym} ${c.expLabel} ${c.kind==="FUT"?"FUT":c.strike+" "+c.cp}`;
function markPx(c){if(c.kind==="EQ")return insts[c.sym].ltp;
  if(c.kind==="FUT")return futPx(c.sym,c.expMs);
  return optPx(c.sym,c.strike,c.expMs,c.cp==="CE").px;}
function fees(side,value,c){let brok,stt;
  if(c.kind==="EQ"){brok=Math.min(20,value*.0003);stt=side==="SELL"?value*.00025:0;}
  else if(c.kind==="FUT"){brok=20;stt=side==="SELL"?value*.0002:0;}
  else{brok=20;stt=side==="SELL"?value*.001:0;}
  const exch=value*(c.kind==="OPT"?.000495:.0000345),gst=.18*(brok+exch),stamp=side==="BUY"?value*.00003:0;
  return brok+stt+exch+gst+stamp;}
function marginReq(side,c,px,qty,prod){const val=px*qty;
  if(c.kind==="EQ")return val/(prod==="MIS"?5:1);
  if(c.kind==="FUT")return futPx(c.sym,c.expMs)*qty*.12;
  return side==="BUY"?val:val+insts[c.sym].ltp*qty*.13;}
function marginUsed(){let m=0;
  for(const k in positions){const p=positions[k];if(!p.qty)continue;const c=p.c;
    if(c.kind==="EQ")m+=Math.abs(p.qty)*p.avg/(p.prod==="MIS"?5:1);
    else if(c.kind==="FUT")m+=futPx(c.sym,c.expMs)*Math.abs(p.qty)*.12;
    else m+=p.qty>0?p.avg*p.qty:markPx(c)*(-p.qty)+insts[c.sym].ltp*(-p.qty)*.13;}
  return m;}
function unrealized(){let u=0;for(const k in positions){const p=positions[k];
  if(p.qty)u+=(markPx(p.c)-p.avg)*p.qty;}return u;}
function applyFill(o,px){const c=o.c,val=px*o.qty,f=fees(o.side,val,c);
  const key=cid(c)+"|"+o.prod;
  const p=positions[key]||(positions[key]={c,prod:o.prod,qty:0,avg:0});
  const dir=o.side==="BUY"?1:-1;let realized=0;
  if(p.qty*dir>=0){p.avg=(Math.abs(p.qty)*p.avg+o.qty*px)/(Math.abs(p.qty)+o.qty);p.qty+=dir*o.qty;}
  else{const cq=Math.min(Math.abs(p.qty),o.qty);
    realized=(px-p.avg)*cq*(p.qty>0?1:-1);p.qty+=dir*o.qty;
    if(p.qty*dir>0)p.avg=px;if(!p.qty)p.avg=0;}
  acct.cash+=realized-f;acct.realized+=realized-f;
  o.status="FILLED";o.fillPx=px;o.fillT=Date.now();
  journal.unshift({t:Date.now(),name:cid(c),side:o.side,qty:o.qty,px,prod:o.prod,fees:f,realized,lot:c.lot||1});
  pushNotif(`${o.side} ${o.qty/(c.lot||1)} ${c.lot&&c.lot>1?"lot(s)":"qty"} ${cid(c)} @ ₹${fmt(px)}`+(realized?` · P&L ${sgn(realized)}₹${fmt(Math.abs(realized))}`:""),"fill");
  needsRebuild=true;persist();}
function checkPending(){for(const o of orders){if(o.status!=="OPEN"||o.type==="MKT")continue;
  const m=markPx(o.c);
  if(o.type==="LMT"&&((o.side==="BUY"&&m<=o.px)||(o.side==="SELL"&&m>=o.px)))applyFill(o,o.px);
  else if(o.type==="SL"&&((o.side==="BUY"&&m>=o.px)||(o.side==="SELL"&&m<=o.px)))applyFill(o,r05(m));}}
function settleExpired(){const now=Date.now();
  for(const k in positions){const p=positions[k];if(!p.qty||p.c.kind==="EQ"||p.c.expMs>now)continue;
    const c=p.c,S=insts[c.sym].ltp;
    const sett=c.kind==="FUT"?S:Math.max(c.cp==="CE"?S-c.strike:c.strike-S,0);
    const realized=(sett-p.avg)*p.qty;
    acct.cash+=realized;acct.realized+=realized;
    journal.unshift({t:now,name:cid(c)+" (EXPIRY)",side:p.qty>0?"SELL":"BUY",qty:Math.abs(p.qty),px:sett,prod:p.prod,fees:0,realized,lot:c.lot||1});
    p.qty=0;p.avg=0;pushNotif(`Expiry settlement: ${cid(c)} @ ₹${fmt(sett)}`,"fill");needsRebuild=true;persist();}}

function spark(canvas,sym){const i=insts[sym];i.ensureBars();
  const b=i.barsTF(5).slice(-40),ctx=canvas.getContext("2d");
  const W=canvas.width=canvas.clientWidth*2||200,H=canvas.height=60;
  ctx.clearRect(0,0,W,H);
  let hi=-1e18,lo=1e18;for(const x of b){hi=Math.max(hi,x.c);lo=Math.min(lo,x.c);}
  const up=b[b.length-1].c>=b[0].c;
  ctx.strokeStyle=up?"#089981":"#e4573d";ctx.lineWidth=2.5;ctx.beginPath();
  b.forEach((x,j)=>{const px2=W*j/(b.length-1),py=H-4-(H-8)*((x.c-lo)/((hi-lo)||1));
    j?ctx.lineTo(px2,py):ctx.moveTo(px2,py);});
  ctx.stroke();}
function donut(canvas,parts){const ctx=canvas.getContext("2d");
  const W=canvas.width=260,H=canvas.height=260,cx=W/2,cy=H/2,R=100,r=62;
  ctx.clearRect(0,0,W,H);
  const tot=parts.reduce((a,p)=>a+p.v,0)||1;let a0=-Math.PI/2;
  for(const p of parts){const a1=a0+2*Math.PI*p.v/tot;
    ctx.beginPath();ctx.arc(cx,cy,R,a0,a1);ctx.arc(cx,cy,r,a1,a0,true);ctx.closePath();
    ctx.fillStyle=p.c;ctx.fill();a0=a1;}}

const emaS=(cl,n)=>{const k=2/(n+1),o=new Array(cl.length).fill(null);if(cl.length<n)return o;
  let e=cl.slice(0,n).reduce((a,b)=>a+b)/n;o[n-1]=e;
  for(let i=n;i<cl.length;i++){e=cl[i]*k+e*(1-k);o[i]=e;}return o;};
const smaS=(cl,n)=>cl.map((_,i)=>i<n-1?null:cl.slice(i-n+1,i+1).reduce((a,b)=>a+b)/n);
function vwapS(bars){let cv=0,cpv=0;return bars.map(b=>{const tp=(b.h+b.l+b.c)/3;cv+=b.v;cpv+=tp*b.v;return cpv/cv;});}
function bbS(cl,n=20,k=2){const ma=smaS(cl,n);return cl.map((_,i)=>{if(i<n-1)return null;
  const seg=cl.slice(i-n+1,i+1),m=ma[i];
  const sd=Math.sqrt(seg.reduce((a,x)=>a+(x-m)*(x-m),0)/n);return{u:m+k*sd,l:m-k*sd,m};});}
function stS(bars,period=10,mult=3){const atr=[];let prev=null;
  const out=new Array(bars.length).fill(null);let ubPrev=null,lbPrev=null,trendUp=true;
  for(let i=0;i<bars.length;i++){const b=bars[i];
    const tr=prev?Math.max(b.h-b.l,Math.abs(b.h-prev.c),Math.abs(b.l-prev.c)):b.h-b.l;
    atr.push(tr);if(atr.length>period)atr.shift();prev=b;
    if(i<period)continue;
    const a=atr.reduce((x,y)=>x+y,0)/atr.length,mid=(b.h+b.l)/2;
    let ub=mid+mult*a,lb=mid-mult*a;
    if(ubPrev!==null){if(b.c>ubPrev)trendUp=true;else if(b.c<lbPrev)trendUp=false;
      if(trendUp)lb=Math.max(lb,lbPrev);else ub=Math.min(ub,ubPrev);}
    ubPrev=ub;lbPrev=lb;out[i]={v:trendUp?lb:ub,up:trendUp};}
  return out;}

function techVals(){const i=insts[selSym],b5=i.barsTF(5),cl=b5.map(x=>x.c);
  const e20=emaS(cl,20).pop(),e50=emaS(cl,50).pop(),r=rsiS(cl.slice(-140)).pop()||50;
  const{m,sig}=macdS(cl);const mv=m[m.length-1],sv=sig[sig.length-1];
  const piv=(i.dayHi+i.dayLo+i.ltp)/3,vw=vwapS(b5.slice(-75)).pop()||i.ltp;
  return[["RSI (14, 5m)",r.toFixed(1),r>70?"Overbought":r<30?"Oversold":"Neutral"],
    ["MACD (12·26·9)",mv!=null?mv.toFixed(2):"—",mv!=null&&sv!=null?(mv>sv?"Above signal — bullish":"Below signal — bearish"):""],
    ["EMA 20 / 50",`${fmt(e20||i.ltp)} / ${fmt(e50||i.ltp)}`,(e20||0)>(e50||0)?"Uptrend bias":"Downtrend bias"],
    ["VWAP (day)",fmt(vw),i.ltp>vw?"Above VWAP":"Below VWAP"],
    ["Day range",fmt(i.dayLo)+" – "+fmt(i.dayHi),"At "+Math.round(100*(i.ltp-i.dayLo)/Math.max(.01,i.dayHi-i.dayLo))+"% of range"],
    ["52-week",fmt(i.lo52,0)+" – "+fmt(i.hi52,0),i.ltp>=i.hi52*.985?"Near 52-W high":i.ltp<=i.lo52*1.015?"Near 52-W low":"Mid-band"],

/* ---------------- [services/LiveFeed] — DhanHQ via local runner ----------------
   When this file is served by tradew_live_runner.py, /api/health reports live
   capability and /api/ltp returns real quotes {SYM: ltp} fetched from the
   user's own Dhan account (official DhanHQ v2 API). Falls back to sim. */
const LIVE={on:false,syms:new Set(),fails:0,checked:false};
function liveApply(map){for(const sym in map){const i=insts[sym];if(!i)continue;
  const p=+map[sym];if(!(p>0))continue;
  i.prev=i.ltp;i.ltp=p;
  i.dayHi=Math.max(i.dayHi,p);i.dayLo=Math.min(i.dayLo,p);
  if(i.bars){const now=Date.now(),last=i.bars[i.bars.length-1];
    if(now-last.t>=60000)i.bars.push({t:now,o:p,h:p,l:p,c:p,v:100});
    else{last.c=p;last.h=Math.max(last.h,p);last.l=Math.min(last.l,p);last.v+=100;}}
  LIVE.syms.add(sym);}}
async function liveInit(){LIVE.checked=true;
  try{const r=await fetch("/api/health",{signal:AbortSignal.timeout(1500)});
    const j=await r.json();
    if(j.live){LIVE.on=true;toast(`LIVE data connected via Dhan — ${j.mapped} instruments mapped`,false);}
    else if(j.reason)console.log("Live feed off:",j.reason);
  }catch(e){/* not served by runner — pure sim */}}
async function livePoll(){if(!LIVE.on)return;
  try{const r=await fetch("/api/ltp",{signal:AbortSignal.timeout(2500)});
    const j=await r.json();
    if(j&&j.quotes){liveApply(j.quotes);LIVE.fails=0;}
    else if(j&&j.error)throw new Error(j.error);
  }catch(e){if(++LIVE.fails>=4){LIVE.on=false;LIVE.syms.clear();
    toast("Live feed lost — back to simulated prices",true);}}}
/* market-hours clock (IST) */
function updClock(){const now=new Date();
  const ist=new Intl.DateTimeFormat("en-IN",{timeZone:"Asia/Kolkata",hour12:false,
    weekday:"short",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(now);
  const g=t=>ist.find(p=>p.type===t).value;
  const wd=g("weekday"),hh=+g("hour"),mm=+g("minute"),tstr=`${g("hour")}:${g("minute")}:${g("second")}`;
  const mins=hh*60+mm,isWk=!["Sat","Sun"].includes(wd);
  const st=isWk&&mins>=555&&mins<930?"live":isWk&&mins>=540&&mins<555?"pre":"closed";
  const dot=$("mktDot"),txt=$("mktTxt");
  if(LIVE.on){setCls(dot,"dot "+(st==="live"?"live":st==="pre"?"":"off"));

  else{setCls(dot,"dot");

/* =================================================================
   [v0.5] TradeW AI (Research) + Sentinel (Safety Nets)
   Two separate systems (see docs/product-architecture/). Both read

/* ---- Sentinel: signal engine ---- */
function scanTraps(){
  const cands=[...new Set([selSym,"NIFTY","BANKNIFTY",...activeWl().syms])].slice(0,6);
  const out=[];
  for(const s of cands){const i=insts[s];if(!i)continue;
    i.ensureBars();const bars=i.barsTF(5).slice(-30);if(bars.length<12)continue;
    const last=bars[bars.length-1],prev2=bars[bars.length-2];
    const window_=bars.slice(-12,-1),prevHigh=Math.max(...window_.map(b=>b.h)),prevLow=Math.min(...window_.map(b=>b.l));
    const avgVol=window_.reduce((a,b)=>a+b.v,0)/window_.length;
    if(last.c>prevHigh&&last.v<avgVol*.75){
      out.push({sym:s,kind:"warn",tag:"Low-Volume Breakout",
        txt:`Price broke above its recent range, but volume is ${Math.round((1-last.v/avgVol)*100)}% below the last-11-bar average. This resembles a low-conviction breakout. Consider waiting for confirmation.`});}
    if(prev2&&prev2.l<prevLow*.998&&last.c>prevLow){
      out.push({sym:s,kind:"warn",tag:"Bear Trap",
        txt:`Sharp dip below the recent support zone was reclaimed within the next candle — this resembles bear-trap characteristics rather than genuine breakdown.`});}
    if(prev2&&prev2.h>prevHigh*1.002&&last.c<prevHigh){
      out.push({sym:s,kind:"warn",tag:"Bull Trap",
        txt:`Push above the recent resistance zone slipped back below it within the next candle — this resembles bull-trap characteristics.`});}
  }
  if(insts.INDIAVIX.ltp>16)out.push({sym:"INDIAVIX",kind:"risk",tag:"Elevated Volatility",
    txt:`India VIX is at ${fmt(insts.INDIAVIX.ltp)}, above its typical calm range — expect wider swings and wider option spreads today.`});
  return out;}
function sentJournalStats(){
  const withRealized=journal.filter(j=>j.realized!==0),wins=withRealized.filter(j=>j.realized>0).length;
  let afterLossTotal=0,afterLossWins=0;
  for(let i=0;i<journal.length-1;i++){const cur=journal[i],prev=journal[i+1];
    if(prev.realized<0){afterLossTotal++;if(cur.realized>0)afterLossWins++;}}
  return{total:withRealized.length,wins,winRate:withRealized.length?wins/withRealized.length*100:0,
    afterLossTotal,afterLossWinRate:afterLossTotal?afterLossWins/afterLossTotal*100:null};}
function journalMood(j,idx,arr){const prev=arr[idx+1];
  if(prev&&j.t-prev.t<3*60000&&prev.realized<0)return"Frustrated";
  if(j.realized>0)return"Confident";if(j.realized<0)return"Anxious";return"Focused";}
function sentNote(j,idx,arr){const mood=journalMood(j,idx,arr);
  if(mood==="Frustrated")return"Re-entered quickly after a loss — flagged for cooling-off review.";
  if(mood==="Confident")return"Followed plan, booked a gain.";
  if(mood==="Anxious")return"Closed at a loss — worth a quick review of the setup.";
  return"Opened in line with your usual pace.";}
function sentReflections(stats){return[
  {cat:"Exit Discipline",txt:journal.length>=3
    ?`You've closed ${stats.total} trade${stats.total===1?"":"s"} this session with a ${stats.winRate.toFixed(0)}% win rate. What pattern do you notice about your exit timing on the losing trades?`
    :"Trade a little and Sentinel will start reflecting your exit patterns back to you here."},
  {cat:"Revenge Trading",txt:stats.afterLossTotal>=2
    ?`Your win rate after a losing trade is ${stats.afterLossWinRate.toFixed(0)}%, vs ${stats.winRate.toFixed(0)}% overall. Consider a short cooling-off period after a loss before re-entering.`
    :"Not enough same-session losses yet to measure this — Sentinel will flag it the moment a pattern appears."},
  {cat:"Position Sizing",txt:journal.length>=3
    ?`Your last ${Math.min(5,journal.length)} trades averaged ₹${fmt(journal.slice(0,5).reduce((a,j)=>a+j.qty*j.px,0)/Math.min(5,journal.length),0)} in size. A sudden jump relative to your average is often the earliest sign of trading on emotion, not plan.`
    :"Your position-sizing pattern will show up here once you've placed a few trades."}];}
function sentObsFeed(traps){const out=traps.map(t=>({t:Date.now(),kind:t.kind,txt:`Flagged ${t.tag.toLowerCase()} in ${insts[t.sym]?insts[t.sym].name:t.sym}`}));
  if(journal[0])out.push({t:journal[0].t,kind:"info",txt:`Logged ${journal[0].side} ${journal[0].name} — mood tagged ${journalMood(journal[0],0,journal)}`});
  out.push({t:Date.now()-30000,kind:"info",txt:`India VIX observed at ${fmt(insts.INDIAVIX.ltp)} — ${insts.INDIAVIX.ltp>16?"above":"within"} normal watch range`});
  out.push({t:Date.now()-90000,kind:"info",txt:"Technical structure scanned across active watchlist — see Trap &amp; Safety card above for any flags."});
  return out.sort((a,b)=>b.t-a.t).slice(0,7);}
function renderTraps(traps){
  if(!traps.length)return`<div class="card lift" style="border-color:var(--green);background:var(--green-bg)">
    <b style="color:var(--green)">No elevated risk detected right now.</b>
    <span style="color:var(--muted);font-size:12.5px"> Sentinel is watching your active watchlist and recent trades continuously.</span></div>`;
  return traps.map(t=>`<div class="trapCard popIn"><span class="tag">${t.tag}</span><div class="body">
    <b>${insts[t.sym]?insts[t.sym].name:t.sym}</b><p>${t.txt}</p>
    <div class="ev">Evidence logged · Compliance &amp; Audit agent · ${new Date().toLocaleTimeString()}</div></div></div>`).join("");}
function renderTimeline(obs){return obs.length?obs.map(o=>
  `<div class="timelineRow"><span class="d ${o.kind}"></span><div><div>${o.txt}</div><div class="tm">${new Date(o.t).toLocaleTimeString()}</div></div></div>`).join("")
  :'<div class="empty">No agent activity yet this session.</div>';}
function pageSentinel(){
  const traps=scanTraps(),stats=sentJournalStats(),refl=sentReflections(stats),obs=sentObsFeed(traps);
  const tradesToday=journal.filter(j=>new Date(j.t).toDateString()===new Date().toDateString()).length;
  const flagged=traps.length,adherence=Math.max(40,100-flagged*9-Math.min(30,Math.max(0,tradesToday-6)*4));
  const delta=Math.round((hash("delta"+tradesToday+flagged)-.5)*10);
  px.sentKey=traps.map(t=>t.tag+t.sym).join(",")+"|"+journal.length;
  return`
  <div class="sentHero riseIn"><div class="ic" style="font-size:15px;font-weight:800;color:#fff">S</div>
    <div><h1>Sentinel is watching, not judging.</h1>
    <p>Four specialised agents observe the market and your own trading behaviour — Sentinel only speaks up when the evidence is worth pausing for.</p></div>
    <div class="obs">Observation only · Not financial advice</div></div>
  <div class="agentRow riseIn">
    <div class="agentCard"><div class="nm">Market &amp; Technical Intelligence</div><div class="st"><span class="d"></span>Observing</div></div>
    <div class="agentCard"><div class="nm">Emotion Intelligence</div><div class="st"><span class="d"></span>Observing</div></div>
    <div class="agentCard"><div class="nm">Trap &amp; Safety Intelligence</div><div class="st"><span class="d"></span>${traps.length?"Synthesizing":"Observing"}</div></div>
    <div class="agentCard"><div class="nm">Compliance &amp; Audit</div><div class="st"><span class="d"></span>Logging</div></div></div>
  <div id="trapZone" class="riseIn">${renderTraps(traps)}</div>
  <div class="card riseIn lift"><h2>AI Reflection Cards <small>· journaling prompts</small></h2>
    <div class="reflGrid">${refl.map(r=>`<div class="reflCard"><span class="cat">${r.cat}</span><p>${r.txt}</p>
      <a onclick="askAi('Reflect with me on ${r.cat}')">Reflect with AI ↗</a></div>`).join("")}</div></div>
  <div class="sent3 riseIn">
    <div class="card lift"><h2>Agent Activity Timeline</h2><div id="sentTimeline">${renderTimeline(obs)}</div></div>
    <div class="card lift"><h2>Observation Feed</h2><div id="sentFeed">${renderTimeline(obs.slice(0,5))}</div></div>
    <div class="card lift"><h2>Session Summary</h2>
      <div class="sessStat"><span>Trades Today</span><span class="v">${tradesToday}</span></div>
      <div class="sessStat"><span>Plan Adherence</span><span class="v" style="color:var(--teal)">${adherence.toFixed(0)}%</span></div>
      <div class="sessStat"><span>Discipline Δ</span><span class="v ${delta>=0?"up":"dn"}">${sgn(delta)}${Math.abs(delta)}</span></div>
      <div class="sessStat"><span>Flagged Events</span><span class="v">${flagged}</span></div></div></div>
  <div class="card riseIn lift"><h2>Trading Journal <small>· mood-tagged by Sentinel</small></h2>
    ${journal.length?`<table class="t"><tr><th>Instrument</th><th>Mood</th><th>Note</th><th></th></tr>
    ${journal.slice(0,10).map((j,idx)=>`<tr><td><b>${j.name}</b><br><span style="font-size:10.5px;color:var(--faint)">${new Date(j.t).toLocaleString()}</span></td>
    <td><span class="moodPill ${journalMood(j,idx,journal)}">${journalMood(j,idx,journal)}</span></td>
    <td style="text-align:left;font-size:12px;color:var(--muted)">${sentNote(j,idx,journal)}</td>
    <td class="num ${cls(j.realized)}">${j.realized?sgn(j.realized)+fmt(j.realized):"—"}</td></tr>`).join("")}</table>`
    :'<div class="empty">Your trades will appear here, each annotated with Sentinel\'s read on the emotional context around it.</div>'}</div>`;}
function updSentinel(tickN){const traps=scanTraps();
  const key=traps.map(t=>t.tag+t.sym).join(",")+"|"+journal.length;
  if(key!==px.sentKey)render();}

/* ---- TradeW AI: ambient copilot dock ---- */
let aiOpen=false,aiHistory=[];
function aiGreeting(){return"Hi, I'm the TradeW AI teammate. I can explain charts, portfolios, news and indicators — but I never give buy or sell advice. What would you like to explore?";}
function aiRenderMsgs(){$("aiMsgs").innerHTML=aiHistory.map(m=>`<div class="aiMsg ${m.who}"><div class="av">${m.who==="ai"?"AI":"You"}</div><div class="bub">${m.txt}</div></div>`).join("");
  $("aiMsgs").scrollTop=$("aiMsgs").scrollHeight;}
function aiRenderChips(){$("aiChips").innerHTML=["Explain this chart","Explain my portfolio","Market pulse"].map(c=>`<button class="aiChip" onclick="askAi('${c}')">${c}</button>`).join("");}
function aiAnswer(q){const ql=q.toLowerCase();
  if(ql.includes("portfolio")){const u=unrealized(),day=acct.realized+u,open=Object.values(positions).filter(p=>p.qty).length;
    return open?`You have ${open} open position${open===1?"":"s"} with unrealised P&amp;L at ${sgn(u)}${inr(Math.abs(u),0)} and today's P&amp;L at ${sgn(day)}${inr(Math.abs(day),0)}. That's an observation, not a recommendation — the Portfolio tab has the full breakdown.`
      :"You don't have any open positions yet, so there's nothing to read into right now. Place a paper trade and I can narrate concentration and movers here.";}
  if(ql.includes("chart")||ql.includes("technical")){const i=insts[selSym],ema=dma(selSym,20);
    return`Looking at ${i.name}, price is ${i.ltp>ema?"trading above":"trading below"} its 20-period average (₹${fmt(ema)}), with today's range ₹${fmt(i.dayLo)}–₹${fmt(i.dayHi)}. Full candle and volume context is on the Chart tab.`;}
  if(ql.includes("pulse")||ql.includes("market")){const n=insts.NIFTY,vix=insts.INDIAVIX;
    return`NIFTY 50 is ${sgn(n.chgPct)}${n.chgPct.toFixed(2)}% today and India VIX is at ${fmt(vix.ltp)} (${vix.ltp>16?"elevated":"calm"} range). ${vix.ltp>16?"Expect wider intraday swings than usual.":"Conditions look orderly for now."}`;}
  if(ql.includes("explain this company")){const nm=q.split(":").pop().trim();
    return`${nm} has a full profile on the Research tab — fundamentals, shareholding, technicals and risk factors. Ask me about any specific number there and I'll walk through it.`;}
  if(ql.toLowerCase().includes("reflect")){return"That pattern is worth sitting with rather than me telling you what it means. Open Sentinel's Trading Journal — the mood tags next to each trade are exactly the raw material for that reflection.";}
  return"I can explain charts, your portfolio, or the day's market pulse — try a quick prompt below, or ask about a specific symbol.";}

  tickN++;

      if(subTab==="chart")drawChart();

      else if(subTab==="fut")updFut();

      else if(subTab==="tech")updTech(tickN);

    else if(view==="screener")updScreener(tickN);
    else if(view==="positions")updPositions();
    else if(view==="portfolio")updPortfolio(tickN);
    else if(view==="sentinel"&&tickN%6===0)updSentinel(tickN);}
  updStrip();updFunds();updWatch();
  if(tkState)tkEst();
}catch(err){console.error("tick error:",err);}},1000);
buildStrip();render();renderBell();updClock();liveInit();
