name: Deploy to Oracle Cloud

# Builds arm64 images (OCI Ampere A1 is arm64), pushes to GitHub Container
# Registry, then deploys over SSH: pull, run migrations, restart the stack.
#
# Required repo secrets:
#   SSH_HOST         public IP / hostname of the OCI VM
#   SSH_USER         e.g. ubuntu (or opc on Oracle Linux)
#   SSH_KEY          private key authorized on the VM
# The default GITHUB_TOKEN is used to push to ghcr.io (no extra secret needed).
#
# Assumes the repo is checked out at /opt/tradew on the VM with .env.prod in
# place (IMAGE_* pointing at ghcr.io/<owner>/tradew-*:latest).

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'services/**'
      - 'packages/**'
      - 'infra/docker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: api
            dockerfile: services/api/Dockerfile
          - name: sentinel
            dockerfile: services/sentinel/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3 # arm64 emulation on amd64 runners
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/tradew-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/tradew-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=/api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/tradew
            git pull --ff-only
            COMPOSE="docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.prod"
            $COMPOSE pull
            $COMPOSE run --rm migrate
            $COMPOSE up -d
            docker image prune -f
