name: Deploy to Oracle Cloud

# Builds arm64 images (OCI Ampere A1 is arm64), pushes to GitHub Container
# Registry, then deploys over SSH: pull, run migrations, restart the stack.
#
# Required repo secrets:
#   SSH_HOST         public IP / hostname of the OCI VM
#   SSH_USER         e.g. ubuntu (or opc on Oracle Linux)
#   SSH_KEY          private key authorized on the VM
# The default GITHUB_TOKEN is used to push to ghcr.io (no extra secret needed).
#
# Assumes the repo is checked out at /opt/tradew on the VM with .env.prod in
# place (IMAGE_* pointing at ghcr.io/<owner>/tradew-*:latest).

# ── DEPLOY IS MANUAL-ONLY (gated 2026-08-16) ────────────────────────────────
#
# The automatic `push: branches: [main]` trigger below is deliberately disabled.
# It is NOT dead config and NOT a bug — restore it by uncommenting the block.
#
# Why: a large accumulated merge (Sentinel dashboard, NSE public data, mail /
# SendGrid, React Query data layer) landed on main in one go. Auto-deploy would
# have taken that straight to the OCI VM — image build, then `prisma migrate
# deploy` against the production database, then a stack restart — unattended and
# on a Sunday. Running migrations on production is the half that does not
# trivially roll back, so the deploy was made a deliberate act instead.
#
# To deploy: GitHub → Actions → "Deploy to Oracle Cloud" → Run workflow.
# To restore automatic deploys: uncomment the `push:` block and delete this note.
on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'apps/web/**'
  #     - 'apps/admin/**'
  #     - 'services/**'
  #     - 'packages/**'
  #     - 'infra/docker/**'
  #     - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: api
            dockerfile: services/api/Dockerfile
          - name: sentinel
            dockerfile: services/sentinel/Dockerfile
          - name: market-data
            dockerfile: services/market-data/Dockerfile
          # The operator console. It ships via docker-compose.admin.yml, which
          # is layered on top of the prod stack and reads ${IMAGE_ADMIN} — but
          # nothing ever built that image, so the tag fell through to its
          # `tradew-admin:local` default and resolved to nothing on the VM.
          # Loopback-bound and SSH-tunnel-only (see that file) does not mean
          # unbuilt: it still has to exist in the registry to be pulled.
          - name: admin
            dockerfile: apps/admin/Dockerfile
            # Baked at build time (NEXT_PUBLIC_*), so it cannot be supplied by
            # compose once CI is the thing producing the image. This is the
            # "View as Trader" link target — the PUBLIC web origin, not the
            # console's own. Set the PUBLIC_WEB_URL repository variable to the
            # deployed domain; unset, the Dockerfile's `/` default applies and
            # that one link points at the console itself.
            build_args: NEXT_PUBLIC_TRADEW_WEB_URL=${{ vars.PUBLIC_WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3 # arm64 emulation on amd64 runners
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/tradew-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/tradew-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            ${{ matrix.build_args }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/tradew
            git pull --ff-only
            COMPOSE="docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.prod"
            $COMPOSE pull
            $COMPOSE run --rm migrate
            $COMPOSE up -d
            docker image prune -f
