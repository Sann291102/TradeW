name: Validate Azure Foundation

on:
  pull_request:
    paths:
      - 'infra/azure/**'
      - '.github/workflows/azure-validate.yml'
  push:
    branches: [main]
    paths:
      - 'infra/azure/**'
      - '.github/workflows/azure-validate.yml'

permissions:
  contents: read

jobs:
  bicep-build:
    name: Build Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Azure foundation
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep build --file infra/azure/main.bicep
            az bicep build --file infra/azure/services.bicep
