# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - tradew

# ── DEPLOY IS MANUAL-ONLY (gated 2026-08-18) ────────────────────────────────
#
# This used to run on every push to `main`, which made "merge a branch" and
# "deploy to the production Azure Web App" the same action. Two problems with
# that, both real rather than theoretical:
#
#   1. There is NO migration step below. The job goes checkout -> npm install
#      -> build -> test -> azure/webapps-deploy. So a merge carrying a Prisma
#      migration shipped code whose client expected tables production did not
#      have, and every query touching them failed at runtime. Schema has to be
#      applied deliberately, before the code that depends on it.
#   2. It contradicted the decision already recorded in `deploy.yml`, which was
#      gated to manual-only on 2026-08-16 for exactly this reason. Having one
#      deploy path gated and another firing automatically meant the gate was
#      advisory.
#
# `ci.yml` still runs the test suites on every push and pull request, including
# `main`, so merging is still verified — it just no longer deploys.
#
# To deploy: run this workflow from the Actions tab (Run workflow), AFTER
# applying migrations with `npm run migrate:deploy -w @tradew/database` against
# the target database.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.__clientidsecretname__ }}
          tenant-id: ${{ secrets.__tenantidsecretname__ }}
          subscription-id: ${{ secrets.__subscriptionidsecretname__ }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'tradew'
          slot-name: 'Production'
          package: .
          
