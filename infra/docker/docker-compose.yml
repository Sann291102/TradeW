services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tradew-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradew
      POSTGRES_PASSWORD: tradew
      POSTGRES_DB: tradew
    ports:
      - '5432:5432'
    volumes:
      - tradew-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tradew -d tradew']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tradew-postgres-data:
