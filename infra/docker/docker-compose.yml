services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tradew-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradew
      POSTGRES_PASSWORD: tradew
      POSTGRES_DB: tradew
    ports:
      - '5433:5432'
    volumes:
      - tradew-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tradew -d tradew']
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tradew-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tradew-setup.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres
    volumes:
      - tradew-pgadmin-data:/var/lib/pgadmin

volumes:
  tradew-postgres-data:
  tradew-pgadmin-data:
